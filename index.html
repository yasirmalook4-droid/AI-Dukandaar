<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AI Dukandaar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f5f7;--c:#fff;--t:#14181f;--m:#6b7280;--p:#0f766e;--pt:#fff;--b:#e2e5ea;--r:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--c:#1a2029;--t:#eef1f5;--m:#97a1b0;--p:#2dd4bf;--pt:#06201c;--b:#2a3340;--r:#f87171}}
:root[data-theme="dark"]{--bg:#10141a;--c:#1a2029;--t:#eef1f5;--m:#97a1b0;--p:#2dd4bf;--pt:#06201c;--b:#2a3340;--r:#f87171}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{padding:12px 12px 96px;max-width:720px;margin:0 auto}
h2{margin:4px 0 12px;font-size:20px}h3{margin:14px 0 6px;font-size:15px;color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.big{font-size:20px;font-weight:700}.m{color:var(--m);font-size:13px}.red{color:var(--r)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:4px 0}
label{font-size:13px;color:var(--m)}
.b{padding:12px 14px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;font-weight:600;min-height:44px}
.pri{background:var(--p);color:var(--pt);border-color:var(--p)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .b{flex:none}
.item{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--b)}.item:last-child{border:0}
table{width:100%;border-collapse:collapse}td,th{padding:6px 3px;text-align:left;font-size:14px}td.n,th.n{text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--m);padding:10px 2px;font:inherit;font-size:12px;min-height:56px}
nav button.on{color:var(--p);font-weight:700}nav .sale{background:var(--p);color:var(--pt);border-radius:14px;margin:-14px 4px 6px;font-weight:700;font-size:14px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;padding:14px;border-radius:16px 16px 0 0}
#scan{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20;align-items:center;justify-content:center;gap:12px}#scan video{width:100%;max-height:75%}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90%}
#print{display:none}.rc{background:#fff;color:#000;padding:8px;font:12px monospace;margin:auto}.rc table td,.rc table th{font-size:12px;color:#000}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}:root{padding:0}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.dots{display:flex;gap:14px;height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--p)}.dots i.f{background:var(--p)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}.pad button{height:68px;border-radius:50%;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:24px;font-weight:600}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
nav svg{display:block;margin:0 auto 2px}.b svg,.item b svg{vertical-align:-5px;margin-right:8px}
nav button:nth-child(1):not(.on) svg,.ic-home{color:#3b82f6}nav button:nth-child(3):not(.on) svg{color:#f59e0b}nav button:nth-child(4):not(.on) svg{color:#8b5cf6}nav button:nth-child(5):not(.on) svg{color:#ec4899}
.item b svg{margin-right:8px;vertical-align:-5px}.item:nth-child(6n+1) b svg{color:#3b82f6}.item:nth-child(6n+2) b svg{color:#10b981}.item:nth-child(6n+3) b svg{color:#f59e0b}.item:nth-child(6n+4) b svg{color:#8b5cf6}.item:nth-child(6n+5) b svg{color:#ec4899}.item:nth-child(6n) b svg{color:#06b6d4}
.grid .card:nth-child(6n+1){border-top:3px solid #0f766e}.grid .card:nth-child(6n+2){border-top:3px solid #3b82f6}.grid .card:nth-child(6n+3){border-top:3px solid #10b981}.grid .card:nth-child(6n+4){border-top:3px solid #f59e0b}.grid .card:nth-child(6n+5){border-top:3px solid #ef4444}.grid .card:nth-child(6n){border-top:3px solid #8b5cf6}
#lowbar{position:fixed;top:env(safe-area-inset-top,0px);left:8px;right:8px;max-height:70%;overflow:auto;background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:8px;z-index:40;display:none;box-shadow:0 8px 30px #0006}
.seg{display:inline-flex;border:1px solid var(--b);border-radius:8px;overflow:hidden;margin-top:4px}.seg button{border:0;background:var(--c);color:var(--m);padding:5px 12px;font:inherit;font-size:13px}.seg button.on{background:var(--p);color:var(--pt);font-weight:700}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--t)}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<div id="app"></div><nav id="nav"></nav><div id="modal"></div>
<div id="scan"><video id="cam" playsinline muted></video><button class="b" onclick="stopScan()">Close scanner</button></div>
<div id="lock"></div><div id="toast"></div><div id="lowbar"></div><div id="print"></div>
<script>
const KEY='dukandaar_v1';let S,tab='home',mem=null,cart=[],cust=null,paidEd=false,ctx=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ld=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16).replace('T',' ');
const today=()=>ld().slice(0,10),m=n=>S.shop.cur+' '+(Math.round(n*100)/100).toLocaleString();
const dev=(()=>{try{let d=localStorage.getItem('dk_dev');if(!d){d=uid();localStorage.setItem('dk_dev',d)}return d}catch(e){return'dev'}})();
const def=()=>({shop:{name:'My Shop',cur:'Rs',wa:'',addr:'',paper:'80',theme:'auto',merge:true},mods:{customers:true,stockin:true,history:true},products:[],customers:[],sales:[],pays:[],stockIns:[],audit:[],inv:1});
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.shop)S=def();if((S.ver||1)<3){try{localStorage.setItem("dk_pre_v3_"+ld().slice(0,10),JSON.stringify(S))}catch(e){}S.rets=S.rets||[];S.stockIns=S.stockIns||[];S.sales.forEach(x=>(x.items||[]).forEach(l=>{if(l.cost==null){const p=S.products.find(q=>q.id===l.pid);l.cost=p?+p.buy||0:0}}));S.ver=3;S.devNames=S.devNames||{};save()}
 try{const t=today(),k='dk_bk_'+t;if(!localStorage.getItem(k)&&S.products.length){localStorage.setItem(k,JSON.stringify(S));Object.keys(localStorage).filter(x=>x.startsWith('dk_bk_')).sort().slice(0,-7).forEach(x=>localStorage.removeItem(x))}}catch(e){}
 theme()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — export a backup now')}}
function theme(){document.body.style.fontSize=(S.shop.fs||16)+"px";const q=document.documentElement.style;if(S.shop.pc){q.setProperty("--p",S.shop.pc);q.setProperty("--pt","#fff")}else{q.removeProperty("--p");q.removeProperty("--pt")}const r=document.documentElement;S.shop.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.shop.theme}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function modal(h){$('#modal').innerHTML='<div class="sheet">'+h+'</div>';$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none';$('#modal').innerHTML=''}
function ask(msg,fn){window._ask=fn;modal(`<p>${msg}</p><div class="row"><button class="b" onclick="closeM()">Cancel</button><button class="b pri" onclick="closeM();_ask()">Confirm</button></div>`)}
function find(list,q,keys){q=q.trim().toLowerCase();if(!q)return list.slice(0,60);
 const sc=x=>{let b=9;for(const k of keys){const v=String(x[k]||'').toLowerCase();if(v===q)return 0;if(v.startsWith(q))b=Math.min(b,1);else if(v.split(/[\s,]+/).some(w=>w.startsWith(q)))b=Math.min(b,2);else if(v.includes(q))b=Math.min(b,3)}return b};
 return list.map(x=>[sc(x),x]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||String(a[1].name).localeCompare(b[1].name)).slice(0,60).map(a=>a[1])}
const byCode=c=>S.products.find(p=>String(p.bc||'').split(',').map(s=>s.trim()).includes(c));
const pk=['name','bc','sku','cat','brand'];
/* scanner */
let stream,scanT;
async function scan(cb,keep){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices){toast('Camera scanning not supported in this browser — type the code or use a hardware scanner');return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){toast('Camera permission denied');return}
 const v=$('#cam');$('#scan').style.display='flex';v.srcObject=stream;await v.play();const d=new BarcodeDetector();let last=0;
 scanT=setInterval(async()=>{try{const r=await d.detect(v);if(r[0]&&Date.now()-last>1300){last=Date.now();navigator.vibrate&&navigator.vibrate(50);if(!keep)stopScan();cb(r[0].rawValue)}}catch(e){}},250)}
function stopScan(){clearInterval(scanT);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('#scan').style.display='none'}
/* nav */
function nav(){const n=[['home','Home'],['sale','Sale'],['products','Products']];if(S.mods.customers)n.push(['customers','Customers']);n.push(['more','More']);
 $('#nav').innerHTML=n.map(([k,l])=>`<button class="${k==='sale'?'sale ':''}${tab===k||(k==='more'&&['stockin','history','backup','settings','reports','sync','expenses'].includes(tab))?'on':''}" onclick="go('${k}')">${ic(k)}${l}</button>`).join('')}
function go(t){tab=t;ctx=null;render()}
function render(){nav();$('#app').innerHTML=V[tab]();window.scrollTo(0,0);if(tab==='sale')upd();if(tab==='reports')repR();if(tab==='products')plist();if(tab==='customers')clist('pf');if(tab==='history')hlist()}
/* views */
const V={};
V.home=()=>{const t=today(),ts=S.sales.filter(s=>s.date.startsWith(t)),sum=a=>a.reduce((x,y)=>x+y,0);
 const rec=sum(S.customers.map(c=>Math.max(0,c.bal||0))),low=S.products.filter(p=>!p.off&&p.stock<=p.min&&p.stock>0).length,out=S.products.filter(p=>!p.off&&p.stock<=0).length;
 const rcv=sum(S.pays.filter(p=>p.date.startsWith(t)).map(p=>p.amt));
 return `<div class="row"><h2>${esc(S.shop.name)}</h2>${S.shop.pin?`<button class="b" style="flex:none" onclick="lockNow()">${ic('lock',18)}Lock</button>`:''}</div>${S.products.length?'':`<div class="card"><b>Welcome!</b><p class="m">Start by adding products, or load a few samples to try the app.</p><button class="b pri" onclick="sample()">Load sample data</button> <button class="b" onclick="go('settings')">Shop setup</button></div>`}
 <div class="grid"><div class="card"><div class="m">Today's sales</div><div class="big">${m(sum(ts.map(s=>s.total)))}</div></div><div class="card"><div class="m">Invoices today</div><div class="big">${ts.length}</div></div>
 <div class="card"><div class="m">Payments received</div><div class="big">${m(rcv)}</div></div><div class="card"><div class="m">Credit given today</div><div class="big">${m(sum(ts.map(s=>s.due)))}</div></div>
 <div class="card"><div class="m">Total receivables</div><div class="big">${m(rec)}</div></div><div class="card"><div class="m">Products</div><div class="big">${S.products.length}</div><div class="m ${low+out?'red':''}">${low} low · ${out} out</div></div></div>
 ${lowBanner()}${bkBanner()}${profitCard()}<h3>Quick actions</h3><div class="grid"><button class="b pri" onclick="go('sale')">${ic('sale',18)}New Sale</button><button class="b" onclick="pform()">${ic('products',18)}Add Product</button><button class="b" onclick="go('reports')">${ic('reports',18)}Reports</button>${S.mods.stockin?`<button class="b" onclick="go('stockin')">Stock In</button>`:''}${S.mods.customers?`<button class="b" onclick="cform()">+ Add Customer</button>`:''}</div>
 <h3>Recent transactions</h3><div class="card">${S.sales.slice(-6).reverse().map(s=>`<div class="item" onclick="receipt('${s.id}')"><span>#${s.no} ${esc(s.cname||'Walk-in')}<br><span class="m">${s.date}</span></span><b>${m(s.total)}</b></div>`).join('')||'<span class="m">No sales yet</span>'}</div>`};
/* SALE */
V.sale=()=>`<h2>New Sale</h2><div class="row"><input id="q" placeholder="Scan / type name, barcode, SKU" oninput="sugg()" onkeydown="if(event.key==='Enter')qEnter()" autocomplete="off"><button class="b pri" onclick="scan(addCode,true)">📷 Scan</button><button class="b" onclick="ctx='sale';pform()">➕ New</button></div>
 <div id="sg"></div><div class="card" id="cartbox"></div><div class="card" id="sum"></div>
 ${S.mods.customers?`<button class="b" style="width:100%;margin-bottom:8px" id="cbtn" onclick="pickCust()">${cust?esc(cust.name):'Select customer (walk-in)'}</button>`:''}
 <div class="grid"><div><label>Discount</label><input id="disc" type="number" inputmode="decimal" value="${cart.disc||''}" oninput="cart.disc=+this.value||0;upd()"></div><div><label>Paid</label><input id="paid" type="number" inputmode="decimal" oninput="paidEd=true;upd(true)"></div></div>
 <label>Due date (if credit)</label><input id="dd" type="date" value="${ld(new Date(Date.now()+7*864e5)).slice(0,10)}">
 <div class="row" style="margin-top:8px"><button class="b" onclick="cart=[];cart.disc=0;cust=null;paidEd=false;render()">Clear</button><button class="b" onclick="holdBill()">Hold</button><button class="b" onclick="holds()">Held (${S.holds.length})</button><button class="b pri" onclick="saveSale()">Save sale</button></div>`;
cart.disc=0;
function sugg(){const q=$('#q').value;$('#sg').innerHTML=q?'<div class="card">'+find(S.products.filter(p=>!p.off),q,pk).slice(0,6).map(p=>`<div class="item" onclick="addP('${p.id}')"><span>${esc(p.name)}<br><span class="m">${esc(p.bc||'')} · stock ${p.stock}</span></span><b>${m(p.sell)}</b></div>`).join('')+'</div>':''}
function qEnter(){const v=$('#q').value.trim();if(!v)return;const p=byCode(v);if(p)addP(p.id);else{const r=find(S.products.filter(p=>!p.off),v,pk);r.length===1?addP(r[0].id):toast(r.length?'Pick a product from the list':'No match')}}
function addCode(c){const p=byCode(c);p?addP(p.id):toast('Unknown barcode '+c)}
function addP(id){const p=S.products.find(x=>x.id===id);if(!p)return;const l=cart.find(x=>x.id===id&&(x.u||'Box')==='Box');l?l.qty++:cart.push({id,qty:1,price:p.sell,u:'Box'});const q=$('#q');if(q){q.value='';q.focus()}$('#sg').innerHTML='';upd()}
function qty(i,d){cart[i].qty=Math.max(0,+(cart[i].qty+d).toFixed(3));if(!cart[i].qty)cart.splice(i,1);upd()}
function tot(){const sub=cart.reduce((a,l)=>a+l.qty*l.price,0),d=Math.min(sub,cart.disc||0);return{sub,d,total:sub-d}}
function upd(keepPaid){if(!$('#cartbox'))return;const t=tot();
 $('#cartbox').innerHTML=cart.length?`<table><tr><th>#</th><th>Product</th><th class="n">Price</th><th class="n">Qty</th><th class="n">Amt</th></tr>${cart.map((l,i)=>{const p=S.products.find(x=>x.id===l.id);return`<tr><td>${i+1}</td><td>${esc(p.name)}${unitSel(l,i,p)}</td><td class="n"><input style="width:70px;padding:6px;text-align:right" type="number" value="${l.price}" onchange="cart[${i}].price=+this.value||0;upd()"></td><td class="n" style="white-space:nowrap"><button class="b" style="padding:2px 10px;min-height:32px" onclick="qty(${i},-1)">−</button> ${l.qty} <button class="b" style="padding:2px 10px;min-height:32px" onclick="qty(${i},1)">+</button></td><td class="n">${+(l.qty*l.price).toFixed(2)}</td></tr>`}).join('')}</table>`:'<span class="m">Cart is empty — scan or search a product</span>';
 if(!paidEd){const pd=$('#paid');if(pd)pd.value=t.total||''}
 const paid=+($('#paid')||{}).value||0,due=Math.max(0,t.total-paid),chg=Math.max(0,paid-t.total);
 $('#sum').innerHTML=`<div class="item"><span>Subtotal</span><span>${m(t.sub)}</span></div><div class="item"><span>Discount</span><span>${m(t.d)}</span></div><div class="item"><b>Grand total</b><b class="big">${m(t.total)}</b></div><div class="item"><span>Remaining / Due</span><b class="${due?'red':''}">${m(due)}</b></div>${chg?`<div class="item"><span>Change to return</span><b>${m(chg)}</b></div>`:''}`}
function pickCust(){modal(`<h2>Customer</h2><input id="cq" placeholder="Search name or phone" oninput="clist('pc')" autofocus><button class="b" style="width:100%" onclick="cust=null;closeM();$('#cbtn').textContent='Select customer (walk-in)'">Walk-in (no customer)</button><div class="row"><input id="nc" placeholder="New customer name"><button class="b pri" onclick="newCust()">+ Add</button></div><div id="cl"></div>`);clist('pc')}
function clist(mode){const r=find(S.customers,$('#cq').value,['name','phone']);$('#cl').innerHTML=r.map(c=>`<div class="item" onclick="${mode==='pc'?`cust=S.customers.find(x=>x.id==='${c.id}');closeM();$('#cbtn').textContent=cust.name`:`cprof('${c.id}')`}"><span>${esc(c.name)}<br><span class="m">${esc(c.phone||'')}</span></span><b class="${c.bal>0?'red':''}">${m(c.bal||0)}</b></div>`).join('')||'<p class="m">No customers</p>'}
function saveSale(){if(!cart.length)return toast('Cart is empty');const t=tot(),paid=+$('#paid').value||0,due=Math.max(0,t.total-paid);
 if(due>0&&!cust)return toast('Pick a customer for a credit / partial sale');
 const neg=cart.filter(l=>(p=>(p[sk(l.u)]||0)<l.qty)(S.products.find(p=>p.id===l.id)));
 const go2=()=>{if(due>0&&cust&&cust.limit>0&&(cust.bal||0)+due>cust.limit)return ask(`Credit limit ${m(cust.limit)} will be exceeded. Continue?`,fin);fin()};
 const fin=()=>{const s={id:uid(),dev,no:S.inv++,date:ld(),cid:cust&&cust.id,cname:cust&&cust.name,sub:t.sub,disc:t.d,total:t.total,paid:Math.min(paid,t.total),due,change:Math.max(0,paid-t.total),method:'',dueDate:due>0?$('#dd').value:'',items:cart.map(l=>{const p=S.products.find(x=>x.id===l.id);const u=l.u||'Box',k=sk(u);p[k]=+((p[k]||0)-l.qty).toFixed(3);return{pid:p.id,name:p.name,bc:p.bc,price:l.price,qty:l.qty,unit:u,f:uF(p,u),cost:+uP(p,u,'buy')||0}})};
  S.sales.push(s);if(cust){cust.bal=(cust.bal||0)+due;if(s.paid>0)S.pays.push({id:uid(),cid:cust.id,sid:s.id,amt:s.paid,date:s.date,method:s.method,kind:'sale'})}else if(s.paid>0)S.pays.push({id:uid(),sid:s.id,amt:s.paid,date:s.date,method:s.method,kind:'sale'});
  save();cart=[];cart.disc=0;cust=null;paidEd=false;render();receipt(s.id);lowAlert(s.items.map(l=>l.pid))};
 neg.length?ask('Stock is lower than quantity for: '+neg.map(l=>esc(S.products.find(p=>p.id===l.id).name)).join(', ')+'. Sell anyway (stock goes negative)?',go2):go2()}
function rhtml(s){return`<div class="rc" style="width:${S.shop.paper==='A4'?'190mm':S.shop.paper+'mm'}"><div style="text-align:center"><b style="font-size:15px">${esc(S.shop.name)}</b><br>${esc(S.shop.addr)}<br>${esc(S.shop.wa)}</div><hr>Invoice #${s.no} · ${s.date}<br>Customer: ${esc(s.cname||'Walk-in')}<hr>
 <table><tr><th>#</th><th>Product</th><th class="n">Price</th><th class="n">Qty</th><th class="n">Amount</th></tr>${s.items.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.name)}${l.unit&&l.unit!=='Piece'?' ('+l.unit+')':''}</td><td class="n">${l.price}</td><td class="n">${l.qty}</td><td class="n">${+(l.price*l.qty).toFixed(2)}</td></tr>`).join('')}</table><hr>
 <table><tr><td>Subtotal</td><td class="n">${s.sub}</td></tr><tr><td>Discount</td><td class="n">${s.disc}</td></tr><tr><td><b>Grand Total</b></td><td class="n"><b>${s.total}</b></td></tr><tr><td>Paid</td><td class="n">${s.paid}</td></tr><tr><td>Remaining / Due</td><td class="n">${s.due}</td></tr></table><hr><div style="text-align:center">Thank you! شکریہ</div></div>`}
function receipt(id){const s=S.sales.find(x=>x.id===id);$('#print').innerHTML=rhtml(s);const c=S.customers.find(x=>x.id===s.cid);
 modal(`<h2>Invoice #${s.no}</h2><div style="overflow:auto;background:#fff;border-radius:8px">${rhtml(s)}</div><div class="row" style="margin-top:10px"><button class="b pri" onclick="window.print()">Print</button><button class="b" onclick="wa('${(c&&c.phone)||''}',${JSON.stringify('Invoice #'+s.no+' — '+S.shop.name+'\nTotal: '+m(s.total)+'\nPaid: '+m(s.paid)+'\nDue: '+m(s.due)).replace(/"/g,'&quot;')})">WhatsApp</button><button class="b" onclick="retForm('${s.id}')">Return</button><button class="b" onclick="closeM()">Close</button></div>`)}
function wa(phone,text){modal(`<h2>WhatsApp message</h2><label>Review / edit before sending</label><textarea id="wt" rows="7">${esc(text)}</textarea><label>Number</label><input id="wn" value="${esc(phone)}" inputmode="tel"><div class="row"><button class="b" onclick="closeM()">Cancel</button><button class="b pri" onclick="waGo()">Open WhatsApp</button></div>`)}
function waGo(){let n=$('#wn').value.replace(/\D/g,'');if(n.startsWith('0'))n='92'+n.slice(1);window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('#wt').value),'_blank');closeM()}

V.products=()=>`<h2>Products</h2><div class="row"><input id="pq" placeholder="Search name, barcode, SKU, category" oninput="plist()"><button class="b" onclick="scan(c=>{const p=byCode(c);p?pform(p.id):pform(null,{bc:c})})">📷</button><button class="b" onclick="impForm()">CSV</button><button class="b pri" onclick="pform()">+ Add</button></div><div class="card" id="pl"></div>`;
function plist(){const r=find(S.products,($('#pq')||{value:''}).value,pk);$('#pl').innerHTML=r.map(p=>`<div class="item" onclick="pform('${p.id}')"><span>${esc(p.name)}${p.off?' <span class="m">(inactive)</span>':''}<br><span class="m">${esc(p.cat||'')} ${esc(p.bc||'')}</span></span><span style="text-align:right"><b>${m(p.sell)}</b><br><span class="${p.stock<=p.min?'red':'m'}">Box ${p.stock}${p.cSell>0||p.cStock?' · Carton '+(p.cStock||0):''}</span></span></div>`).join('')||'<span class="m">No products found</span>'}
const UNITS=['Piece','Box','Carton','Pack','Dozen','Kg','Gram','Liter'];
function pform(id,pre){const p=id?S.products.find(x=>x.id===id):Object.assign({name:'',bc:'',sku:'',cat:'',brand:'',unit:'Piece',buy:0,sell:0,stock:0,min:5},pre||{});
 const f=(k,l,t='text')=>`<label>${l}</label><input id="f_${k}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${esc(p[k])}">`;
 modal(`<h2>${id?'Edit':'New'} product</h2>${f('name','Name *')}<div class="row"><div>${f('bc','Barcode(s), comma separated')}</div><button class="b" onclick="scan(c=>{$('#f_bc').value=c})">📷</button></div>${f('sku','SKU')}<div class="grid"><div>${f('cat','Category')}</div><div>${f('brand','Brand')}</div></div><label>Unit</label><select id="f_unit">${UNITS.map(u=>`<option ${u===p.unit?'selected':''}>${u}</option>`).join('')}</select>
 ${unitFields(p)}<div class="grid"><div>${f('buy','Purchase price (per piece)','number')}</div><div>${f('sell','Sale price','number')}</div><div>${f('stock','Stock','number')}</div><div>${f('min','Low-stock alert','number')}</div></div>
 ${id?`<label><input type="checkbox" id="f_off" style="width:auto" ${p.off?'checked':''}> Inactive (hide from sales)</label>`:''}
 <div class="row" style="margin-top:8px"><button class="b" onclick="closeM()">Cancel</button><button class="b pri" onclick="psave('${id||''}')">Save</button></div>`)}
function psave(id){const g=k=>$('#f_'+k).value.trim(),n=k=>+g(k)||0;const name=g('name');if(!name)return toast('Product name is required');if(n('sell')<0||n('buy')<0)return toast('Prices cannot be negative');
 const codes=g('bc').split(',').map(s=>s.trim()).filter(Boolean),dup=S.products.find(x=>x.id!==id&&String(x.bc||'').split(',').map(s=>s.trim()).some(c=>codes.includes(c)));
 if(dup){modal(`<h2>Barcode already exists</h2><p>This barcode belongs to <b>${esc(dup.name)}</b>. Duplicates are not allowed.</p><div class="row"><button class="b" onclick="closeM()">Back</button><button class="b pri" onclick="pform('${dup.id}')">Open existing</button></div>`);return}
 const o={name,bc:codes.join(','),sku:g('sku'),cat:g('cat'),brand:g('brand'),unit:$('#f_unit').value,buy:n('buy'),sell:n('sell'),stock:n('stock'),min:n('min')};UN().forEach(u=>{const q=+$('#u_'+u+'_q').value;o[u]=q>0?{q,buy:+$('#u_'+u+'_buy').value||0,sell:+$('#u_'+u+'_sell').value||0}:null});
 let p=S.products.find(x=>x.id===id);if(p){Object.keys(o).forEach(k=>{if(p[k]!==o[k])S.audit.push({id:uid(),dev,date:ld(),pid:p.id,field:k,old:p[k],new:o[k]})});Object.assign(p,o);p.off=$('#f_off').checked}
 else{p=Object.assign({id:uid(),dev,created:ld()},o);S.products.push(p)}
 save();closeM();toast('Saved');if(ctx==='sale'){ctx=null;tab='sale';render();addP(p.id)}else if(ctx==='stock'){ctx=null;stockSel(p.id)}else render()}

 const dup=o.phone&&S.customers.find(x=>x.id!==id&&x.phone===o.phone);if(dup)return toast('Phone already used by '+dup.name);

function payForm(id){const c=S.customers.find(x=>x.id===id);modal(`<h2>Receive payment — ${esc(c.name)}</h2><p class="m">Due: ${m(c.bal||0)}</p><input id="pa" type="number" inputmode="decimal" placeholder="Amount" value="${c.bal>0?c.bal:''}"><select id="pmm"><option>Cash</option><option>Bank</option><option>Easypaisa</option><option>JazzCash</option><option>Other</option></select><div class="row"><button class="b" onclick="cprof('${id}')">Back</button><button class="b pri" onclick="payGo('${id}')">Save</button></div>`)}

function remind(id){const c=S.customers.find(x=>x.id===id);wa(c.phone,`السلام علیکم ${c.name}،\nیاد دہانی کے لیے عرض ہے کہ آپ کے ذمے ہمارے ${S.shop.name} کا ${m(c.bal||0)} بقایا ہے۔\nمہربانی کرکے سہولت کے مطابق ادائیگی فرما دیں۔\nجزاک اللہ / شکریہ۔`)}

/* LOCK */
let tries=0,until=0,buf='',hid=0;
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dk1'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(p)}}
function pad(title,cb,cancel,forgotB){buf='';const L=$('#lock');L.style.display='flex';
 const draw=err=>{L.innerHTML=`<div style="color:var(--p)">${ic('lock',44)}</div><div class="big">${esc(S.shop.name)}</div><div class="m" style="min-height:20px">${err||title}</div><div class="dots ${err?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pk2(${n})">${n}</button>`).join('')}<button style="font-size:13px" onclick="${cancel?'padX()':forgotB?'forgot()':''}">${cancel?'Cancel':forgotB?'Forgot?':''}</button><button onclick="pk2(0)">0</button><button onclick="pk2(-1)">⌫</button></div>`};
 window.pk2=async n=>{if(n<0)buf=buf.slice(0,-1);else if(buf.length<4)buf+=n;draw();if(buf.length===4){const p=buf;buf='';await cb(p,draw)}};window.padX=()=>{L.style.display='none'};draw()}

function bkBanner(){return S.sales.length&&Date.now()-(S.shop.lastBk||0)>7*864e5?`<div class="card" style="border-color:#f59e0b"><b>Backup reminder</b><p class="m">No backup in the last 7 days.</p><div class="row"><button class="b pri" onclick="go('backup')">Backup now</button><button class="b" onclick="S.shop.lastBk=Date.now();save();render()">Done</button></div></div>`:''}
/* QR sync */
async function gz(t){const r=new Blob([t]).stream().pipeThrough(new CompressionStream('gzip')),b=new Uint8Array(await new Response(r).arrayBuffer());let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
async function ungz(t){const b=Uint8Array.from(atob(t),c=>c.charCodeAt(0));return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
function pkgD(){const t=today(),ge=x=>(x.date||x.created||'').slice(0,10)>=t,sa=S.sales.filter(ge),pa=S.pays.filter(ge),pid=new Set([...sa.flatMap(x=>x.items.map(l=>l.pid)),...S.stockIns.filter(ge).map(x=>x.pid)]),cid=new Set([...sa.map(x=>x.cid),...pa.map(x=>x.cid)]);return JSON.stringify({app:'dukandaar',v:3,pid:uid(),dev,name:S.shop.devName||'Device',at:ld(),products:S.products.filter(p=>pid.has(p.id)||ge(p)),customers:S.customers.filter(c=>cid.has(c.id)||ge(c)),sales:sa,pays:pa,rets:S.rets.filter(ge),stockIns:S.stockIns.filter(ge),exp:S.exp.filter(ge)})}
async function qrSend(all){if(typeof qrcode==='undefined'||typeof CompressionStream==='undefined')return toast('QR needs internet once (to load) and a recent Chrome');const z=await gz(all?pkg():pkgD()),id=uid(),CH=600,n=Math.ceil(z.length/CH),fr=[];for(let i=0;i<n;i++)fr.push(['DK',id,i,n,z.slice(i*CH,(i+1)*CH)].join('|'));
 modal(`<h2>Show this to the Master phone</h2><div id="qr" style="background:#fff;padding:8px;border-radius:12px;max-width:340px;margin:auto"></div><p class="m" id="qn" style="text-align:center"></p><button class="b" style="width:100%" onclick="clearInterval(window._qi);closeM()">Done</button>`);let k=0;const draw=()=>{const q=qrcode(0,'L');q.addData(fr[k]);q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});$('#qn').textContent='Code '+(k+1)+' of '+n+' — keep it steady until Master finishes';k=(k+1)%n};draw();window._qi=setInterval(draw,1400)}
let rx={};
function qrRecv(){rx={};scan(t=>{const a=t.split('|');if(a[0]!=='DK'||a.length<5)return;if(rx.id&&a[1]!==rx.id)return;rx.id=a[1];rx.n=+a[3];(rx.c=rx.c||{})[a[2]]=a.slice(4).join('|');const got=Object.keys(rx.c).length;toast('Scanned '+got+' / '+rx.n);if(got===rx.n){stopScan();let z='';for(let k=0;k<rx.n;k++)z+=rx.c[k];ungz(z).then(j=>mergeGo(j)).catch(()=>toast('Could not read the codes — try again'))}},true)}
/* v5: simple product screen, supplier info, low-stock alerts */
function pform(id,pre){const p=id?S.products.find(x=>x.id===id):Object.assign({name:'',bc:'',company:'',supplier:'',sphone:'',buy:'',sell:'',cBuy:'',cSell:'',stock:'',cStock:'',min:5},pre||{});
 const f=(k,l,v,t='number')=>`<label>${l}</label><input id="f_${k}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${esc(v??'')}">`;
 modal(`<h2>${id?'Edit':'New'} product</h2>${f('name','Product name *',p.name,'text')}<label>Barcode / QR</label><div class="row"><input id="f_bc" value="${esc(p.bc)}" placeholder="Scan or type"><button class="b pri" onclick="scan(c=>{$('#f_bc').value=c;toast('Barcode captured')})">📷 Scan</button></div>
 <div class="grid"><div>${f('company','Company',p.company,'text')}</div><div>${f('supplier','Supplier',p.supplier,'text')}</div></div>${f('sphone','Supplier phone',p.sphone,'tel')}
 <h3>📦 Box</h3><div class="grid"><div>${f('bBuy','Purchase price',p.buy)}</div><div>${f('bSell','Sale price',p.sell)}</div></div>${f('bStock','Box stock',p.stock)}
 <h3>🚚 Carton</h3><div class="grid"><div>${f('cBuy','Purchase price',p.cBuy)}</div><div>${f('cSell','Sale price',p.cSell)}</div></div>${f('cStock','Carton stock',p.cStock)}
 ${f('min','Low-stock alert at (or below)',p.min)}${id?`<label><input type="checkbox" id="f_off" style="width:auto" ${p.off?'checked':''}> Inactive (hide from sales)</label>`:''}<div class="row" style="margin-top:8px"><button class="b" onclick="closeM()">Cancel</button><button class="b pri" onclick="psave('${id||''}')">Save</button></div>`)}
function psave(id){const g=k=>$('#f_'+k).value.trim(),n=k=>+g(k)||0,name=g('name');if(!name)return toast('Product name is required');if(['bBuy','bSell','cBuy','cSell'].some(k=>n(k)<0))return toast('Prices cannot be negative');
 const codes=g('bc').split(',').map(x=>x.trim()).filter(Boolean),dup=S.products.find(x=>x.id!==id&&String(x.bc||'').split(',').map(x=>x.trim()).some(c=>codes.includes(c)));
 if(dup){modal(`<h2>Barcode already exists</h2><p>This barcode belongs to <b>${esc(dup.name)}</b>.</p><div class="row"><button class="b" onclick="closeM()">Back</button><button class="b pri" onclick="pform('${dup.id}')">Open existing</button></div>`);return}
 const o={name,bc:codes.join(','),company:g('company'),supplier:g('supplier'),sphone:g('sphone'),buy:n('bBuy'),sell:n('bSell'),cBuy:n('cBuy'),cSell:n('cSell'),stock:n('bStock'),cStock:n('cStock'),min:n('min')};
 let p=S.products.find(x=>x.id===id);if(p){Object.keys(o).forEach(k=>{if(p[k]!==o[k])S.audit.push({id:uid(),dev,date:ld(),pid:p.id,field:k,old:p[k],new:o[k]})});Object.assign(p,o);p.off=$('#f_off').checked}
 else{p=Object.assign({id:uid(),dev,created:ld(),unit:'Box',cat:'',sku:'',brand:''},o);S.products.push(p)}
 save();closeM();toast('Saved');if(ctx==='sale'){ctx=null;tab='sale';render();addP(p.id)}else if(ctx==='stock'){ctx=null;stockSel(p.id)}else render();lowAlert([p.id])}
function lowItems(ids){const r=[];S.products.filter(p=>!p.off&&(!ids||ids.includes(p.id))).forEach(p=>{if(p.stock<=p.min&&(p.stock>0||p.sell>0))r.push([p,'Box',p.stock]);if((p.cSell>0||p.cStock>0||p.cBuy>0)&&(p.cStock||0)<=p.min)r.push([p,'Carton',p.cStock||0])});return r}
const lowH=r=>r.map(([p,u,n])=>`<div class="card" style="border-left:4px solid #ef4444"><b>⚠️ Low Stock Alert</b><br>${esc(p.name)}<br>${u} Stock: <b class="red">${n}</b><br><span class="m">${p.company?'Company: '+esc(p.company)+'<br>':''}Supplier: ${esc(p.supplier||'—')}${p.sphone?'<br>Phone: '+esc(p.sphone):''}</span><br>Stock dobara mangwayen${p.sphone?`<div class="row" style="margin-top:6px"><a class="b pri" style="text-decoration:none;text-align:center" href="tel:${esc(p.sphone)}">📞 Call Supplier</a><button class="b" onclick="waSup('${p.id}')">WhatsApp</button></div>`:''}</div>`).join('');
function waSup(id){const p=S.products.find(x=>x.id===id);wa(p.sphone,`Salam ${p.supplier||''}, hamein ${p.name} ka stock chahiye. Barae meherbani bhej dein.`)}
function lowAlert(ids){const r=lowItems(ids);if(!r.length)return;if(ids){const e=$('#lowbar');e.innerHTML=lowH(r.slice(0,3))+'<button class="b" style="width:100%" onclick="this.parentNode.style.display=\'none\'">Dismiss</button>';e.style.display='block'}else modal('<h2>Low stock</h2>'+lowH(r)+'<button class="b" style="width:100%" onclick="closeM()">Close</button>')}
function lowBanner(){const r=lowItems();return r.length?`<div class="card" style="border-left:4px solid #ef4444"><b>⚠️ ${r.length} low-stock item(s)</b>${r.slice(0,4).map(([p,u,n])=>`<div class="item"><span>${esc(p.name)}<br><span class="m">${esc(p.supplier||'No supplier')}</span></span><b class="red">${u} ${n}</b></div>`).join('')}<button class="b" style="width:100%" onclick="lowAlert()">Details & call supplier</button></div>`:''}
load();if((S.ver||1)<5){try{localStorage.setItem("dk_pre_v5_"+ld().slice(0,10),JSON.stringify(S))}catch(e){}S.products.forEach(p=>{if(p.cSell==null){p.cBuy=p.carton?+p.carton.buy||0:0;p.cSell=p.carton?+p.carton.sell||0:0}p.cStock=p.cStock||0;p.company=p.company||'';p.supplier=p.supplier||'';p.sphone=p.sphone||''});S.ver=5;save()}theme();
S.exp=S.exp||[];S.holds=S.holds||[];if(S.shop.pin)lockNow();render();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body></html>
